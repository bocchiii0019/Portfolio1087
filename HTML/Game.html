<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>design GAME!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@100..700&family=McLaren&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="CSS.css">
</head>

<body>

    <header class="header">
        <a class="logo" href="Home.html">JJ</a>
        <nav class="nav">
            <a href="Home.html">home</a>
            <a href="AboutMe.html">aboutME</a>
            <a href="Home.html#work" class="active">work</a>
        </nav>
    </header>

    <section class="page-head">
        <h1 class="page-title">2D Game<br>Art!</h1>
    </section>

    <main class="game-section">
        <h2 class="game-heading">“Eco mayBe Tomorrow?!”</h2>

        <div class="game-pic game-banner">
            <img src="../pic/game3.png" alt="Eco mayBe Tomorrow?!">
        </div>

        <p class="game-desc">
            “เกมแนวบริหารจัดการทรัพยากรในชีวิตประจำวันเพื่อไม่ให้โลกแตก
            จะเกิดอะไรขึ้นเมื่อการตัดสินใจของเราทุกอย่างนั้นส่งผลต่ออนาคตของเรา?”
        </p>

        <div class="game-gallery game-gallery-big">
            <div class="game-pic"><img src="../pic/game1.png" alt="Game screen 1"></div>
            <div class="game-pic"><img src="../pic/game2.png" alt="Game screen 2"></div>
        </div>

        <div class="game-gallery game-gallery-small">
            <div class="game-pic"><img src="../pic/game7.png" alt="Game screen 3"></div>
            <div class="game-pic"><img src="../pic/game4.png" alt="Game screen 4"></div>
            <div class="game-pic"><img src="../pic/game5.png" alt="Game screen 5"></div>
            <div class="game-pic"><img src="../pic/game6.png" alt="Game screen 6"></div>
        </div>
    </main>

    <div class="footer-wave"></div>

    <script src="./script.js" defer></script>
